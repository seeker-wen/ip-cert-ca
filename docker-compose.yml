version: '3'
services:
  ip-cert-ca:
    image: ip-cert-ca:1.0.0
    restart: always
    # 容器对外暴露的端口号9999，该端口号应与服务的端口号保持一致
    ports:
      - 9999:9999
    deploy:
      replicas: 1
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
    environment:
      SERVICE_PORT: 9999
      SIGN_CERT_YEARS: 20
    networks:
      - ip-cert-ca
networks:
  ip-cert-ca:
    driver: bridge
    ipam:
      config:
        - subnet: 10.87.0.0/16
